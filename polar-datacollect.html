<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polar — Collecte de données</title>
<style>
  body { background:#111; color:#eee; font-family: -apple-system, sans-serif; margin:0; padding:16px; }
  h1 { font-size:18px; margin-bottom:4px;}
  h2 { font-size:16px; color:#9cf; margin:4px 0; }
  button { display:block; width:100%; padding:16px; margin:8px 0; font-size:17px; border:none; border-radius:8px; background:#2d6cdf; color:white; font-weight:bold; }
  button:disabled { background:#444; color:#888; }
  button.stop { background:#c0392b; }
  button.secondary { background:#333; font-weight:normal; font-size:14px; padding:10px;}
  #progress { font-size:13px; color:#888; margin-bottom:8px; }
  #configName { font-size:24px; text-align:center; margin:12px 0; padding:12px; background:#1a1a2e; border-radius:8px; }
  #big { font-size:44px; text-align:center; margin:12px 0; font-weight:bold; }
  #hr { font-size:20px; text-align:center; color:#e74c3c; margin-bottom:8px; }
  #countdown { font-size:56px; text-align:center; font-weight:bold; color:#2ecc71; }
  canvas { width:100%; height:100px; background:#000; border-radius:6px; margin:8px 0; }
  #log { background:#000; color:#0f0; font-family:monospace; font-size:10px; padding:6px; height:90px; overflow-y:auto; white-space:pre-wrap; border-radius:6px; margin-top:8px; }
  .done { color:#2ecc71; }
  .pending { color:#666; }
  .current { color:#f39c12; font-weight:bold; }
  #queueList { font-size:12px; line-height:1.6; margin:8px 0; }
</style>
</head>
<body>
<h1>Collecte de données — Polar Verity Sense <span style="color:#666;font-size:12px;">(v3 — ACC+GYRO+MAG)</span></h1>
<button id="btnConnect">1. Connecter</button>
<div id="hr">HR: –</div>

<div id="progress"></div>
<div id="configName">–</div>
<div id="countdown"></div>
<div id="big">–</div>
<canvas id="chart" width="600" height="100"></canvas>

<button id="btnStart" disabled>Démarrer l'enregistrement (15s)</button>
<button id="btnRedo" class="secondary" disabled>↩️ Refaire la précédente</button>
<button id="btnSkip" class="secondary" disabled>Passer cette configuration</button>
<button id="btnDownloadAll" class="secondary" disabled>Télécharger tout (JSON combiné)</button>
<button id="btnReset" class="secondary">Réinitialiser la progression</button>

<div id="repPanel" style="display:none; background:#1a1a2e; padding:14px; border-radius:8px; margin:10px 0;">
  <div style="text-align:center; margin-bottom:8px;">Combien de répétitions (ou cycles) avez-vous faites pendant ces 15s ? (ex: 6.5 si arrêté à mi-mouvement)</div>
  <input id="repInput" type="number" inputmode="decimal" step="0.5" style="width:100%; font-size:24px; text-align:center; padding:10px; border-radius:6px; border:none;" placeholder="ex: 12">
  <button id="btnSubmitReps">Valider et passer à la suite</button>
</div>

<div id="queueList"></div>
<div class="log-label">Log :</div>
<div id="log"></div>

<script>
const PMD_SERVICE = 'fb005c80-02e7-f387-1cad-8acd2d8df0c8';
const PMD_CONTROL = 'fb005c81-02e7-f387-1cad-8acd2d8df0c8';
const PMD_DATA    = 'fb005c82-02e7-f387-1cad-8acd2d8df0c8';
const HR_SERVICE = '0000180d-0000-1000-8000-00805f9b34fb';
const HR_CHAR = '00002a37-0000-1000-8000-00805f9b34fb';
let gyroFactor = 0.07000000029802322; // verified default from a real device response; overwritten below if a fresh value arrives
let magFactor = 0.001500000013038516; // verified default from a real device response; overwritten below if a fresh value arrives

const PROTOCOL = [];
const EXERCISES = ['Pompes', 'Tractions', 'Squats', 'Tirage élastique', 'Brasse (air)', 'Crawl (air)', 'Dos crawlé (air)'];
for (const position of ['Avant-bras', 'Biceps']) {
  for (const exercise of EXERCISES) {
    PROTOCOL.push({ exercise, position });
  }
}

const STORAGE_KEY = 'polarDataCollectProgress';
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw).configIndex || 0;
  } catch (e) {}
  return 0;
}
function saveProgress(idx) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ configIndex: idx })); } catch (e) {}
}

let configIndex = loadProgress();
let isRecording = false;
let recordStartTime = 0;
let currentAcc = [];
let currentHr = [];
let latestHr = null;
const recordings = [];

let device, server, controlChar, dataChar, hrChar;
const logEl = document.getElementById('log');
const bigEl = document.getElementById('big');
const hrEl = document.getElementById('hr');
const configNameEl = document.getElementById('configName');
const progressEl = document.getElementById('progress');
const countdownEl = document.getElementById('countdown');
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let history = [];

function log(msg) {
  const t = new Date().toISOString().substr(11,8);
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function renderQueue() {
  const el = document.getElementById('queueList');
  el.innerHTML = PROTOCOL.map((c, i) => {
    const cls = i < configIndex ? 'done' : (i === configIndex ? 'current' : 'pending');
    const mark = i < configIndex ? '✓ ' : (i === configIndex ? '▶ ' : '· ');
    return `<div class="${cls}">${mark}${c.exercise} — ${c.position}</div>`;
  }).join('');
}

function updateConfigDisplay() {
  document.getElementById('btnRedo').disabled = configIndex <= 0 || !controlChar;
  if (configIndex >= PROTOCOL.length) {
    configNameEl.textContent = 'Terminé !';
    progressEl.textContent = `${PROTOCOL.length}/${PROTOCOL.length} configurations enregistrées`;
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnSkip').disabled = true;
    document.getElementById('btnDownloadAll').disabled = false;
  } else {
    const c = PROTOCOL[configIndex];
    const prev = configIndex > 0 ? PROTOCOL[configIndex - 1] : null;
    const positionChanged = prev && prev.position !== c.position;
    configNameEl.innerHTML = (positionChanged ? `<div style="color:#f39c12; font-size:14px; margin-bottom:6px;">⚠️ Changez le capteur de position : ${c.position}</div>` : '')
      + `${c.exercise} — ${c.position}`;
    progressEl.textContent = `Configuration ${configIndex + 1}/${PROTOCOL.length} — en pause, prêt(e) quand vous voulez`;
  }
  renderQueue();
}

function drawChart() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = '#2ecc71';
  ctx.beginPath();
  const max = Math.max(...history, 100);
  history.forEach((v, i) => {
    const x = (i / 300) * canvas.width;
    const y = canvas.height - (v / max) * canvas.height;
    if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
}

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('btnConnect').onclick = async () => {
  try {
    log('Recherche de périphériques "Polar"...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'Polar' }],
      optionalServices: [PMD_SERVICE, HR_SERVICE]
    });
    log(`Sélectionné: ${device.name}`);
    device.addEventListener('gattserverdisconnected', () => log('⚠️ Déconnecté'));
    server = await device.gatt.connect();
    log('GATT connecté.');

    const pmdService = await server.getPrimaryService(PMD_SERVICE);
    controlChar = await pmdService.getCharacteristic(PMD_CONTROL);
    dataChar = await pmdService.getCharacteristic(PMD_DATA);
    await controlChar.startNotifications();
    controlChar.addEventListener('characteristicvaluechanged', (e) => {
      const dv = e.target.value;
      log('CONTROL rx: ' + Array.from(new Uint8Array(dv.buffer)).map(b=>b.toString(16).padStart(2,'0')).join(' '));
      // START acks for GYRO and MAG carry their FACTOR as a TLV — read it live
      // rather than trusting a hardcoded value, in case it ever differs.
      if (dv.byteLength >= 5 && dv.getUint8(1) === 0x02 && (dv.getUint8(2) === 0x05 || dv.getUint8(2) === 0x06)) {
        const isGyro = dv.getUint8(2) === 0x05;
        let offset = 5;
        while (offset + 2 <= dv.byteLength) {
          const type = dv.getUint8(offset);
          const count = dv.getUint8(offset + 1);
          offset += 2;
          if (type === 5 && count >= 1 && offset + 4 <= dv.byteLength) { // FACTOR
            const factor = dv.getFloat32(offset, true);
            if (isGyro) { gyroFactor = factor; log('Facteur GYRO reçu: ' + factor); }
            else { magFactor = factor; log('Facteur MAG reçu: ' + factor); }
          }
          offset += count * (type === 5 ? 4 : (type === 4 ? 1 : 2));
        }
      }
    });
    await dataChar.startNotifications();
    dataChar.addEventListener('characteristicvaluechanged', (e) => handleAccData(e.target.value));
    log('PMD prêt.');

    // Start ACC stream: 52Hz, 16-bit, ±8G, 3 channels (verified settings)
    const accCmd = new Uint8Array([0x02, 0x02, 0x00, 0x01, 52, 0, 0x01, 0x01, 16, 0, 0x02, 0x01, 8, 0, 0x04, 0x01, 3]);
    await controlChar.writeValue(accCmd);
    log('Flux ACC démarré.');

    // Start GYRO stream: 52Hz, 16-bit, ±2000 deg/s, 3 channels (verified settings)
    const gyroCmd = new Uint8Array([0x02, 0x05, 0x00, 0x01, 52, 0, 0x01, 0x01, 16, 0, 0x02, 0x01, 0xd0, 0x07, 0x04, 0x01, 3]);
    await controlChar.writeValue(gyroCmd);
    log('Flux GYRO démarré.');

    // Start MAG stream: 50Hz (closest supported rate to 52Hz), 16-bit, ±50 Gauss, 3 channels (verified settings)
    const magCmd = new Uint8Array([0x02, 0x06, 0x00, 0x01, 50, 0, 0x01, 0x01, 16, 0, 0x02, 0x01, 50, 0, 0x04, 0x01, 3]);
    await controlChar.writeValue(magCmd);
    log('Flux MAG démarré.');

    // HR service
    try {
      const hrService = await server.getPrimaryService(HR_SERVICE);
      hrChar = await hrService.getCharacteristic(HR_CHAR);
      await hrChar.startNotifications();
      hrChar.addEventListener('characteristicvaluechanged', (e) => handleHrData(e.target.value));
      log('HR prêt.');
    } catch (e) {
      log('HR indisponible: ' + e);
    }

    document.getElementById('btnConnect').disabled = true;
    document.getElementById('btnStart').disabled = configIndex >= PROTOCOL.length;
    document.getElementById('btnSkip').disabled = configIndex >= PROTOCOL.length;
    updateConfigDisplay();
  } catch (err) {
    log('ERREUR connexion: ' + err);
  }
};

function handleHrData(value) {
  const flags = value.getUint8(0);
  const is16bit = flags & 0x1;
  const bpm = is16bit ? value.getUint16(1, true) : value.getUint8(1);
  latestHr = bpm;
  hrEl.textContent = 'HR: ' + bpm + ' bpm';
  if (isRecording) {
    currentHr.push({ t: performance.now() - recordStartTime, bpm });
  }
}

// ---- Verified PMD delta-frame decompression ----
function bytesToBitArray(bytes) {
  const bits = [];
  for (const byte of bytes) { for (let i = 0; i < 8; i++) bits.push((byte >> i) & 1); }
  return bits;
}
function parseDeltaFrame(data, channels, bitWidth) {
  const bits = bytesToBitArray(data);
  const samples = [];
  let offset = 0;
  while (offset + bitWidth * channels <= bits.length) {
    const chSamples = [];
    for (let c = 0; c < channels; c++) {
      let value = 0;
      for (let i = 0; i < bitWidth; i++) value |= bits[offset + i] << i;
      offset += bitWidth;
      if (bitWidth > 1 && (value & (1 << (bitWidth - 1)))) value |= (-1 << bitWidth);
      chSamples.push(value);
    }
    samples.push(chSamples);
  }
  return samples;
}
function parseDeltaFramesAll(data, channels, resolution) {
  if (data.length === 0) return [];
  const resBytes = Math.ceil(resolution / 8);
  let offset = 0;
  const ref = [];
  for (let c = 0; c < channels; c++) {
    let v = 0;
    for (let b = 0; b < resBytes; b++) v |= data[offset + b] << (8 * b);
    const bits = resBytes * 8;
    if (v & (1 << (bits - 1))) v |= (-1 << bits);
    offset += resBytes;
    ref.push(v);
  }
  const samples = [ref];
  while (offset < data.length) {
    if (offset + 2 > data.length) break;
    const deltaSize = data[offset]; offset += 1;
    const sampleCount = data[offset]; offset += 1;
    const bitLength = sampleCount * deltaSize * channels;
    const length = Math.ceil(bitLength / 8);
    if (offset + length > data.length) break;
    const chunk = data.slice(offset, offset + length);
    const deltas = parseDeltaFrame(chunk, channels, deltaSize);
    for (const delta of deltas) {
      if (delta.length !== channels) continue;
      const last = samples[samples.length - 1];
      samples.push(last.map((v, i) => v + delta[i]));
    }
    offset += length;
  }
  return samples;
}

const FS_NOMINAL = 52.0;
const FS_MAG = 50.0; // magnetometer runs at a different rate (52Hz isn't one of its supported options)
let runningSampleCount = 0;
let recordStartSampleCount = 0;
let runningGyroSampleCount = 0;
let recordStartGyroSampleCount = 0;
let currentGyro = [];
let runningMagSampleCount = 0;
let recordStartMagSampleCount = 0;
let currentMag = [];

function handleAccData(value) {
  if (value.byteLength <= 10) return;
  const measType = value.getUint8(0);

  if (measType === 0x05) {
    handleGyroData(value);
    return;
  }
  if (measType === 0x06) {
    handleMagData(value);
    return;
  }
  if (measType !== 0x02) return;

  const frameTypeByte = value.getUint8(9);
  const frameType = frameTypeByte & 0x7F;
  const isCompressed = (frameTypeByte & 0x80) > 0;
  if (!(isCompressed && frameType === 1)) return;
  const content = new Uint8Array(value.buffer, value.byteOffset + 10, value.byteLength - 10);

  let sampleList;
  try {
    sampleList = parseDeltaFramesAll(content, 3, 16);
  } catch (e) {
    log('Erreur décodage ACC: ' + e);
    return;
  }
  if (sampleList.length === 0) return;

  for (const [x, y, z] of sampleList) {
    const mag = Math.sqrt(x*x + y*y + z*z);
    history.push(mag);
    if (isRecording) {
      const t = (runningSampleCount - recordStartSampleCount) / FS_NOMINAL * 1000;
      currentAcc.push({ t, x, y, z, mag: Math.round(mag) });
    }
    runningSampleCount += 1;
  }
  if (history.length > 300) history = history.slice(-300);
  const [lx, ly, lz] = sampleList[sampleList.length - 1];
  bigEl.textContent = Math.round(Math.sqrt(lx*lx+ly*ly+lz*lz)) + ' mG';
  drawChart();
}

function handleGyroData(value) {
  const frameTypeByte = value.getUint8(9);
  const frameType = frameTypeByte & 0x7F;
  const isCompressed = (frameTypeByte & 0x80) > 0;
  if (!(isCompressed && frameType === 0)) return; // gyro uses TYPE_0, verified against real device
  const content = new Uint8Array(value.buffer, value.byteOffset + 10, value.byteLength - 10);

  let sampleList;
  try {
    sampleList = parseDeltaFramesAll(content, 3, 16);
  } catch (e) {
    log('Erreur décodage GYRO: ' + e);
    return;
  }
  if (sampleList.length === 0) return;

  for (const [x, y, z] of sampleList) {
    if (isRecording) {
      const t = (runningGyroSampleCount - recordStartGyroSampleCount) / FS_NOMINAL * 1000;
      currentGyro.push({
        t,
        x: Math.round(x * gyroFactor * 100) / 100,
        y: Math.round(y * gyroFactor * 100) / 100,
        z: Math.round(z * gyroFactor * 100) / 100
      });
    }
    runningGyroSampleCount += 1;
  }
}

function handleMagData(value) {
  const frameTypeByte = value.getUint8(9);
  const frameType = frameTypeByte & 0x7F;
  const isCompressed = (frameTypeByte & 0x80) > 0;
  if (!(isCompressed && frameType === 0)) return; // mag TYPE_0, verified against real device (3ch, direct-to-Gauss)
  const content = new Uint8Array(value.buffer, value.byteOffset + 10, value.byteLength - 10);

  let sampleList;
  try {
    sampleList = parseDeltaFramesAll(content, 3, 16);
  } catch (e) {
    log('Erreur décodage MAG: ' + e);
    return;
  }
  if (sampleList.length === 0) return;

  for (const [x, y, z] of sampleList) {
    if (isRecording) {
      const t = (runningMagSampleCount - recordStartMagSampleCount) / FS_MAG * 1000;
      currentMag.push({
        t,
        x: Math.round(x * magFactor * 1000) / 1000,
        y: Math.round(y * magFactor * 1000) / 1000,
        z: Math.round(z * magFactor * 1000) / 1000
      });
    }
    runningMagSampleCount += 1;
  }
}

function beep(freq, durationMs, delayMs) {
  setTimeout(() => {
    try {
      const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx2.createOscillator();
      const gain = ctx2.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.value = 0.3;
      osc.connect(gain);
      gain.connect(ctx2.destination);
      osc.start();
      setTimeout(() => { osc.stop(); ctx2.close(); }, durationMs);
    } catch (e) { log('Beep erreur: ' + e); }
  }, delayMs);
}

document.getElementById('btnStart').onclick = () => {
  if (configIndex >= PROTOCOL.length) return;
  const c = PROTOCOL[configIndex];
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnSkip').disabled = true;

  // 3s "get ready" phase: BLE keeps streaming but nothing is buffered yet,
  // so setup/positioning motion never enters the recorded window.
  let prep = 3;
  countdownEl.textContent = 'Préparez-vous: ' + prep;
  beep(400, 120, 0);
  const prepInterval = setInterval(() => {
    prep -= 1;
    if (prep > 0) {
      countdownEl.textContent = 'Préparez-vous: ' + prep;
      beep(400, 120, 0);
    } else {
      clearInterval(prepInterval);
      startActualRecording(c);
    }
  }, 1000);
};

function startActualRecording(c) {
  currentAcc = [];
  currentHr = [];
  currentGyro = [];
  currentMag = [];
  recordStartSampleCount = runningSampleCount;
  recordStartGyroSampleCount = runningGyroSampleCount;
  recordStartMagSampleCount = runningMagSampleCount;
  isRecording = true;
  beep(800, 150, 0); // "go" tone

  let remaining = 15;
  countdownEl.textContent = remaining;
  const interval = setInterval(() => {
    remaining -= 1;
    countdownEl.textContent = remaining > 0 ? remaining : '';
    if (remaining > 0 && remaining <= 3) {
      beep(600, 120, 0); // short warning beep at 3, 2, 1
    }
    if (remaining <= 0) {
      clearInterval(interval);
      beep(1000, 400, 0); // longer, higher end-of-recording beep
      finishRecording(c);
    }
  }, 1000);
};

function finishRecording(c) {
  isRecording = false;
  countdownEl.textContent = '';
  // Gate on ground-truth rep count before saving/advancing — this stays visible
  // until the user submits, so nothing auto-advances into the next exercise.
  const panel = document.getElementById('repPanel');
  const input = document.getElementById('repInput');
  panel.style.display = 'block';
  input.value = '';
  input.focus();

  document.getElementById('btnSubmitReps').onclick = () => {
    const reps = parseFloat(input.value);
    if (isNaN(reps)) {
      input.style.outline = '2px solid #c0392b';
      return;
    }
    const recording = {
      exercise: c.exercise,
      position: c.position,
      startedAtIso: new Date().toISOString(),
      groundTruthReps: reps,
      accSamples: currentAcc,
      gyroSamples: currentGyro,
      magSamples: currentMag,
      hrSamples: currentHr
    };
    recordings.push(recording);
    const safeName = (c.exercise + '_' + c.position).toLowerCase().replace(/[^a-z0-9]+/g, '-');
    downloadJSON(recording, safeName + '.json');
    log(`Enregistré: ${c.exercise} / ${c.position} — ${currentAcc.length} éch. ACC, ${currentGyro.length} éch. GYRO, ${currentMag.length} éch. MAG, ${currentHr.length} éch. HR, ${reps} reps déclarées`);

    panel.style.display = 'none';
    configIndex += 1;
    saveProgress(configIndex);
    updateConfigDisplay();
    document.getElementById('btnStart').disabled = configIndex >= PROTOCOL.length;
    document.getElementById('btnSkip').disabled = configIndex >= PROTOCOL.length;
  };
}

document.getElementById('btnRedo').onclick = () => {
  if (configIndex <= 0) return;
  configIndex -= 1;
  const c = PROTOCOL[configIndex];
  const last = recordings[recordings.length - 1];
  if (last && last.exercise === c.exercise && last.position === c.position) {
    recordings.pop();
    log(`Annulé (à refaire): ${c.exercise} / ${c.position} — l'ancien fichier téléchargé reste sur votre téléphone, ignorez-le`);
  } else {
    log(`Retour à: ${c.exercise} / ${c.position} (était passée, pas de fichier à annuler)`);
  }
  saveProgress(configIndex);
  updateConfigDisplay();
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnSkip').disabled = false;
};

document.getElementById('btnSkip').onclick = () => {
  if (configIndex >= PROTOCOL.length) return;
  log(`Passé: ${PROTOCOL[configIndex].exercise} / ${PROTOCOL[configIndex].position}`);
  configIndex += 1;
  saveProgress(configIndex);
  updateConfigDisplay();
};

document.getElementById('btnDownloadAll').onclick = () => {
  downloadJSON(recordings, 'toutes_les_configurations.json');
};

document.getElementById('btnReset').onclick = () => {
  if (!confirm('Réinitialiser la progression ? (les fichiers déjà téléchargés restent sur votre téléphone)')) return;
  configIndex = 0;
  saveProgress(0);
  updateConfigDisplay();
  document.getElementById('btnStart').disabled = !controlChar;
  document.getElementById('btnSkip').disabled = !controlChar;
};

updateConfigDisplay();
</script>
</body>
</html>
