<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polar Verity Sense — Test connectivité</title>
<style>
  body { background:#111; color:#eee; font-family: -apple-system, sans-serif; margin:0; padding:16px; }
  h1 { font-size:18px; }
  button { display:block; width:100%; padding:14px; margin:8px 0; font-size:16px; border:none; border-radius:8px; background:#2d6cdf; color:white; }
  button:disabled { background:#444; }
  button.stop { background:#c0392b; }
  #log { background:#000; color:#0f0; font-family:monospace; font-size:11px; padding:8px; height:160px; overflow-y:auto; white-space:pre-wrap; border-radius:6px; margin-top:8px; }
  #big { font-size:48px; text-align:center; margin:16px 0; font-weight:bold; }
  #xyz { text-align:center; font-family:monospace; font-size:14px; color:#aaa; }
  canvas { width:100%; height:120px; background:#000; border-radius:6px; margin-top:8px; }
  .note { font-size:12px; color:#888; margin-top:4px;}
</style>
</head>
<body>
<h1>Polar Verity Sense — Test brut <span style="color:#666;font-size:12px;">(v6)</span></h1>
<button id="btnConnect">1. Connecter (Bluetooth)</button>
<button id="btnSettings" disabled>2. Demander réglages ACC (GET_SETTINGS)</button>
<button id="btnStart" disabled>3. Démarrer flux ACC (best-guess)</button>
<button id="btnStop" class="stop" disabled>Stop ACC</button>
<hr style="border-color:#333; margin:16px 0;">
<button id="btnGyroSettings" disabled>4. Demander réglages GYRO (GET_SETTINGS)</button>
<button id="btnGyroStart" disabled>5. Démarrer flux GYRO (auto depuis réglages reçus)</button>
<button id="btnGyroStop" class="stop" disabled>Stop GYRO</button>
<hr style="border-color:#333; margin:16px 0;">
<button id="btnMagSettings" disabled>6. Demander réglages MAG (GET_SETTINGS)</button>
<button id="btnMagStart" disabled>7. Démarrer flux MAG (auto depuis réglages reçus)</button>
<button id="btnMagStop" class="stop" disabled>Stop MAG</button>

<div id="big">–</div>
<div id="xyz">x=– y=– z=–</div>
<canvas id="chart" width="600" height="120"></canvas>
<div class="log-label">Log brut (octets hex) :</div>
<div id="log"></div>
<p class="note">Ouvrir cette page dans Chrome (pas dans une webview embarquée) pour que le Bluetooth fonctionne. Le décodage des trames ACC est une meilleure estimation — si ça échoue, on lit les octets bruts ensemble.</p>

<script>
const PMD_SERVICE = 'fb005c80-02e7-f387-1cad-8acd2d8df0c8';
const PMD_CONTROL = 'fb005c81-02e7-f387-1cad-8acd2d8df0c8';
const PMD_DATA    = 'fb005c82-02e7-f387-1cad-8acd2d8df0c8';

let device, server, controlChar, dataChar;
const logEl = document.getElementById('log');
const bigEl = document.getElementById('big');
const xyzEl = document.getElementById('xyz');
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let history = [];

function log(msg) {
  const t = new Date().toISOString().substr(11,8);
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function toHex(dataview) {
  let out = [];
  for (let i = 0; i < dataview.byteLength; i++) {
    out.push(dataview.getUint8(i).toString(16).padStart(2,'0'));
  }
  return out.join(' ');
}

function drawChart() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = '#2ecc71';
  ctx.beginPath();
  const max = Math.max(...history, 100);
  history.forEach((v, i) => {
    const x = (i / 150) * canvas.width;
    const y = canvas.height - (v / max) * canvas.height;
    if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
}

document.getElementById('btnConnect').onclick = async () => {
  try {
    log('Recherche de périphériques "Polar"...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'Polar' }],
      optionalServices: [PMD_SERVICE, '0000180d-0000-1000-8000-00805f9b34fb']
    });
    log(`Sélectionné: ${device.name}`);
    device.addEventListener('gattserverdisconnected', () => log('⚠️ Déconnecté'));
    server = await device.gatt.connect();
    log('GATT connecté.');
    const service = await server.getPrimaryService(PMD_SERVICE);
    log('Service PMD trouvé.');
    controlChar = await service.getCharacteristic(PMD_CONTROL);
    dataChar = await service.getCharacteristic(PMD_DATA);
    log('Caractéristiques control + data trouvées.');

    await controlChar.startNotifications();
    controlChar.addEventListener('characteristicvaluechanged', (e) => {
      const dv = e.target.value;
      log('CONTROL rx: ' + toHex(dv));
      // opcode 1 = GET_SETTINGS response; type 5 = GYRO, type 6 = MAG
      if (dv.byteLength >= 5 && dv.getUint8(1) === 0x01 && dv.getUint8(2) === 0x05) {
        const parsed = parseSettingsResponse(dv);
        lastGyroSettings = parsed;
        logSettings(parsed, 'Réglages GYRO reçus');
      }
      if (dv.byteLength >= 5 && dv.getUint8(1) === 0x01 && dv.getUint8(2) === 0x06) {
        const parsed = parseSettingsResponse(dv);
        lastMagSettings = parsed;
        logSettings(parsed, 'Réglages MAG reçus');
      }
    });

    await dataChar.startNotifications();
    dataChar.addEventListener('characteristicvaluechanged', (e) => {
      handleData(e.target.value);
    });
    log('Notifications activées. Prêt.');

    document.getElementById('btnSettings').disabled = false;
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnGyroSettings').disabled = false;
    document.getElementById('btnGyroStart').disabled = false;
    document.getElementById('btnMagSettings').disabled = false;
    document.getElementById('btnMagStart').disabled = false;
    document.getElementById('btnConnect').disabled = true;
  } catch (err) {
    log('ERREUR connexion: ' + err);
  }
};

document.getElementById('btnSettings').onclick = async () => {
  try {
    // GET_MEASUREMENT_SETTINGS: [0x01, type=0x02 (ACC)]
    await controlChar.writeValue(new Uint8Array([0x01, 0x02]));
    log('GET_SETTINGS envoyé pour ACC (0x01 0x02).');
  } catch (err) {
    log('ERREUR GET_SETTINGS: ' + err);
  }
};

document.getElementById('btnStart').onclick = async () => {
  try {
    // REQUEST_MEASUREMENT_START: [0x02, type=0x02 ACC, then TLV settings]
    // best-guess TLV: SAMPLE_RATE(0x00) count=1 val=52 | RESOLUTION(0x01) count=1 val=16 | RANGE(0x02) count=1 val=8
    const cmd = new Uint8Array([
      0x02, 0x02,
      0x00, 0x01, 52, 0,
      0x01, 0x01, 16, 0,
      0x02, 0x01, 8, 0,
      0x04, 0x01, 3
    ]);
    await controlChar.writeValue(cmd);
    log('START ACC envoyé (best-guess settings): ' + toHex(new DataView(cmd.buffer)));
    document.getElementById('btnStop').disabled = false;
  } catch (err) {
    log('ERREUR START: ' + err);
  }
};

document.getElementById('btnStop').onclick = async () => {
  try {
    await controlChar.writeValue(new Uint8Array([0x03, 0x02]));
    log('STOP ACC envoyé.');
  } catch (err) {
    log('ERREUR STOP: ' + err);
  }
};

// ---- Generic GET_SETTINGS response parser (works for any measurement type) ----
const SETTING_FIELD_SIZE = { 0: 2, 1: 2, 2: 2, 3: 4, 4: 1, 5: 4, 6: 16 }; // SAMPLE_RATE,RESOLUTION,RANGE,RANGE_MILLIUNIT,CHANNELS,FACTOR,SECURITY
const SETTING_NAMES = { 0: 'SAMPLE_RATE', 1: 'RESOLUTION', 2: 'RANGE', 3: 'RANGE_MILLIUNIT', 4: 'CHANNELS', 5: 'FACTOR', 6: 'SECURITY' };

function parseSettingsResponse(dv) {
  // header: [0]=0xF0 resp code, [1]=opcode, [2]=measurement type, [3]=error, [4]=more-frames flag
  const opcode = dv.getUint8(1);
  const measType = dv.getUint8(2);
  const errorCode = dv.getUint8(3);
  const settings = {};
  let offset = 5;
  while (offset + 2 <= dv.byteLength) {
    const type = dv.getUint8(offset);
    const count = dv.getUint8(offset + 1);
    offset += 2;
    const fieldSize = SETTING_FIELD_SIZE[type] ?? 2;
    const values = [];
    for (let i = 0; i < count; i++) {
      if (offset + fieldSize > dv.byteLength) break;
      if (type === 5) { // FACTOR: IEEE-754 float32 LE
        values.push(dv.getFloat32(offset, true));
      } else if (fieldSize === 1) {
        values.push(dv.getUint8(offset));
      } else if (fieldSize === 2) {
        values.push(dv.getUint16(offset, true));
      } else if (fieldSize === 4) {
        values.push(dv.getUint32(offset, true));
      } else {
        values.push(Array.from({length: fieldSize}, (_, k) => dv.getUint8(offset + k))); // e.g. SECURITY, just show raw bytes
      }
      offset += fieldSize;
    }
    settings[type] = values;
  }
  return { opcode, measType, errorCode, settings };
}

function logSettings(parsed, label) {
  log(`${label}: opcode=${parsed.opcode} type=${parsed.measType} erreur=${parsed.errorCode}`);
  for (const [type, values] of Object.entries(parsed.settings)) {
    const name = SETTING_NAMES[type] ?? ('type' + type);
    log(`  ${name}: [${values.join(', ')}]`);
  }
}

let lastGyroSettings = null;
let lastMagSettings = null;

document.getElementById('btnGyroSettings').onclick = async () => {
  try {
    await controlChar.writeValue(new Uint8Array([0x01, 0x05])); // GET_SETTINGS, type=5 GYRO
    log('GET_SETTINGS envoyé pour GYRO (0x01 0x05).');
  } catch (err) {
    log('ERREUR GET_SETTINGS GYRO: ' + err);
  }
};

document.getElementById('btnGyroStart').onclick = async () => {
  try {
    if (!lastGyroSettings) {
      log('⚠️ Pas encore reçu les réglages GYRO — appuyez sur 4 d\'abord et attendez la réponse CONTROL rx.');
      return;
    }
    // Build START command from whatever the device actually reported as supported
    // (not a hardcoded guess): SAMPLE_RATE, RESOLUTION, RANGE, CHANNELS if present;
    // FACTOR and SECURITY are informational, never sent back.
    const parts = [0x02, 0x05]; // REQUEST_MEASUREMENT_START, type=5 GYRO
    for (const type of [0, 1, 2, 4]) { // SAMPLE_RATE, RESOLUTION, RANGE, CHANNELS
      const values = lastGyroSettings.settings[type];
      if (!values || values.length === 0) continue;
      const chosen = values[0]; // first offered option; log makes it easy to pick a different one if needed
      const fieldSize = SETTING_FIELD_SIZE[type];
      parts.push(type, 1);
      if (fieldSize === 1) {
        parts.push(chosen);
      } else if (fieldSize === 2) {
        parts.push(chosen & 0xFF, (chosen >> 8) & 0xFF);
      } else if (fieldSize === 4) {
        parts.push(chosen & 0xFF, (chosen >> 8) & 0xFF, (chosen >> 16) & 0xFF, (chosen >> 24) & 0xFF);
      }
    }
    const cmd = new Uint8Array(parts);
    await controlChar.writeValue(cmd);
    log('START GYRO envoyé (depuis réglages reçus): ' + toHex(new DataView(cmd.buffer)));
    document.getElementById('btnGyroStop').disabled = false;
  } catch (err) {
    log('ERREUR START GYRO: ' + err);
  }
};

document.getElementById('btnGyroStop').onclick = async () => {
  try {
    await controlChar.writeValue(new Uint8Array([0x03, 0x05]));
    log('STOP GYRO envoyé.');
  } catch (err) {
    log('ERREUR STOP GYRO: ' + err);
  }
};

document.getElementById('btnMagSettings').onclick = async () => {
  try {
    await controlChar.writeValue(new Uint8Array([0x01, 0x06])); // GET_SETTINGS, type=6 MAG
    log('GET_SETTINGS envoyé pour MAG (0x01 0x06).');
  } catch (err) {
    log('ERREUR GET_SETTINGS MAG: ' + err);
  }
};

document.getElementById('btnMagStart').onclick = async () => {
  try {
    if (!lastMagSettings) {
      log('⚠️ Pas encore reçu les réglages MAG — appuyez sur 6 d\'abord et attendez la réponse CONTROL rx.');
      return;
    }
    const parts = [0x02, 0x06]; // REQUEST_MEASUREMENT_START, type=6 MAG
    for (const type of [0, 1, 2, 4]) { // SAMPLE_RATE, RESOLUTION, RANGE, CHANNELS
      const values = lastMagSettings.settings[type];
      if (!values || values.length === 0) continue;
      const chosen = values[0];
      const fieldSize = SETTING_FIELD_SIZE[type];
      parts.push(type, 1);
      if (fieldSize === 1) {
        parts.push(chosen);
      } else if (fieldSize === 2) {
        parts.push(chosen & 0xFF, (chosen >> 8) & 0xFF);
      } else if (fieldSize === 4) {
        parts.push(chosen & 0xFF, (chosen >> 8) & 0xFF, (chosen >> 16) & 0xFF, (chosen >> 24) & 0xFF);
      }
    }
    const cmd = new Uint8Array(parts);
    await controlChar.writeValue(cmd);
    log('START MAG envoyé (depuis réglages reçus): ' + toHex(new DataView(cmd.buffer)));
    document.getElementById('btnMagStop').disabled = false;
  } catch (err) {
    log('ERREUR START MAG: ' + err);
  }
};

document.getElementById('btnMagStop').onclick = async () => {
  try {
    await controlChar.writeValue(new Uint8Array([0x03, 0x06]));
    log('STOP MAG envoyé.');
  } catch (err) {
    log('ERREUR STOP MAG: ' + err);
  }
};

// ---- Polar PMD delta-frame decompression (ported + verified against real captured bytes) ----
function bytesToBitArray(bytes) {
  const bits = [];
  for (const byte of bytes) {
    for (let i = 0; i < 8; i++) bits.push((byte >> i) & 1);
  }
  return bits;
}

function parseDeltaFrame(data, channels, bitWidth) {
  const bits = bytesToBitArray(data);
  const samples = [];
  let offset = 0;
  while (offset + bitWidth * channels <= bits.length) {
    const chSamples = [];
    for (let c = 0; c < channels; c++) {
      let value = 0;
      for (let i = 0; i < bitWidth; i++) value |= bits[offset + i] << i;
      offset += bitWidth;
      if (bitWidth > 1 && (value & (1 << (bitWidth - 1)))) value |= (-1 << bitWidth);
      chSamples.push(value);
    }
    samples.push(chSamples);
  }
  return samples;
}

function parseDeltaFramesAll(data, channels, resolution) {
  if (data.length === 0) return [];
  const resBytes = Math.ceil(resolution / 8);
  let offset = 0;
  const ref = [];
  for (let c = 0; c < channels; c++) {
    let v = 0;
    for (let b = 0; b < resBytes; b++) v |= data[offset + b] << (8 * b);
    // sign-extend
    const bits = resBytes * 8;
    if (v & (1 << (bits - 1))) v |= (-1 << bits);
    offset += resBytes;
    ref.push(v);
  }
  const samples = [ref];
  while (offset < data.length) {
    if (offset + 2 > data.length) break;
    const deltaSize = data[offset]; offset += 1;
    const sampleCount = data[offset]; offset += 1;
    const bitLength = sampleCount * deltaSize * channels;
    const length = Math.ceil(bitLength / 8);
    if (offset + length > data.length) break;
    const chunk = data.slice(offset, offset + length);
    const deltas = parseDeltaFrame(chunk, channels, deltaSize);
    for (const delta of deltas) {
      if (delta.length !== channels) continue;
      const last = samples[samples.length - 1];
      samples.push(last.map((v, i) => v + delta[i]));
    }
    offset += length;
  }
  return samples;
}

function handleData(value) {
  const hex = toHex(value);
  log('DATA rx (' + value.byteLength + ' octets): ' + hex);

  if (value.byteLength <= 10) return;
  const measType = value.getUint8(0);

  if (measType === 0x05) {
    // GYRO — logging raw only for now; decode comes once we've verified the
    // FACTOR/settings format against a real response, same discipline as ACC.
    const frameTypeByte = value.getUint8(9);
    log(`  (trame GYRO, frame_type_byte=${frameTypeByte.toString(16)}, contenu=${value.byteLength-10} octets)`);
    return;
  }

  if (measType === 0x06) {
    // MAG — same: raw only until we've seen and verified a real frame_type
    // (Polar's spec allows two different mag frame layouts, one with an extra
    // calibration-status channel — need real bytes to know which this device sends).
    const frameTypeByte = value.getUint8(9);
    log(`  (trame MAG, frame_type_byte=${frameTypeByte.toString(16)}, contenu=${value.byteLength-10} octets)`);
    return;
  }

  if (measType !== 0x02) return;

  const frameTypeByte = value.getUint8(9);
  const frameType = frameTypeByte & 0x7F;
  const isCompressed = (frameTypeByte & 0x80) > 0;
  const content = new Uint8Array(value.buffer, value.byteOffset + 10, value.byteLength - 10);

  let sampleList = [];
  try {
    if (isCompressed && frameType === 1) {
      sampleList = parseDeltaFramesAll(content, 3, 16); // 16-bit resolution, 3 channels (x,y,z)
    } else {
      log('Type de frame non géré ici (type=' + frameType + ', compressé=' + isCompressed + ')');
      return;
    }
  } catch (e) {
    log('Erreur décodage: ' + e);
    return;
  }

  if (sampleList.length === 0) return;
  for (const [x, y, z] of sampleList) {
    const mag = Math.sqrt(x*x + y*y + z*z);
    history.push(mag);
  }
  if (history.length > 300) history = history.slice(-300);
  const [lx, ly, lz] = sampleList[sampleList.length - 1];
  bigEl.textContent = Math.round(Math.sqrt(lx*lx+ly*ly+lz*lz)) + ' mG';
  xyzEl.textContent = `x=${lx} y=${ly} z=${lz} mG  (${sampleList.length} échantillons)`;
  drawChart();
}
</script>
</body>
</html>
