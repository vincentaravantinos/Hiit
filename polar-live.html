<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polar — Enregistrement (analyse hors-ligne)</title>
<style>
  body { background:#111; color:#eee; font-family: -apple-system, sans-serif; margin:0; padding:16px; }
  h1 { font-size:18px; margin-bottom:4px;}
  button { display:block; width:100%; padding:14px; margin:6px 0; font-size:16px; border:none; border-radius:8px; background:#2d6cdf; color:white; font-weight:bold; }
  button:disabled { background:#444; color:#888; }
  button.secondary { background:#333; font-weight:normal; font-size:13px; padding:8px;}
  button.active-toggle { background:#f39c12; color:#111; }
  button.recording { background:#c0392b; }
  #posToggle { display:flex; gap:8px; margin:8px 0; }
  #posToggle button { margin:0; }
  #exerciseGrid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin:8px 0; }
  #exerciseGrid button { margin:0; font-size:14px; padding:16px 8px; }
  #hr { font-size:18px; text-align:center; color:#e74c3c; margin-bottom:4px; }
  #recStatus { text-align:center; font-size:20px; color:#888; margin:16px 0; min-height:28px; }
  #recStatus.active { color:#c0392b; }
  #repPanel { display:none; background:#1a1a2e; padding:14px; border-radius:8px; margin:10px 0; }
  #repPanel input { width:100%; font-size:24px; text-align:center; padding:10px; border-radius:6px; border:none; }
  #log { background:#000; color:#0f0; font-family:monospace; font-size:10px; padding:6px; height:110px; overflow-y:auto; white-space:pre-wrap; border-radius:6px; margin-top:8px; }
  #history { font-size:12px; margin-top:8px; }
  #history div { padding:3px 0; border-bottom:1px solid #333; }
  .match { color:#2ecc71; } .off { color:#e74c3c; }
</style>
</head>
<body>
<h1>Enregistrement — Polar Verity Sense <span style="color:#666;font-size:12px;">(v10 — sans distraction, analyse hors-ligne uniquement)</span></h1>
<button id="btnConnect">Connecter</button>
<div id="hr">HR: –</div>

<div id="posToggle">
  <button id="posAvantBras" class="active-toggle">Avant-bras</button>
  <button id="posBiceps">Biceps</button>
</div>

<div id="exerciseGrid"></div>

<div id="recStatus"></div>

<div id="repPanel">
  <div style="text-align:center; margin-bottom:8px;">Combien de reps/cycles avez-vous vraiment faits ? (analyse précise: <span id="offlineGuess">–</span>, décimales ok ex: 6.5)</div>
  <input id="repInput" type="number" inputmode="decimal" step="0.5">
  <button id="btnSubmitReps">Valider et sauvegarder</button>
  <button id="btnCancelSession" class="secondary">Annuler cette session (ne pas garder)</button>
</div>

<button id="btnDownloadAll" class="secondary" disabled>Télécharger tout (JSON combiné)</button>
<div id="history"></div>
<div class="log-label">Log :</div>
<div id="log"></div>

<script>
const PMD_SERVICE = 'fb005c80-02e7-f387-1cad-8acd2d8df0c8';
const PMD_CONTROL = 'fb005c81-02e7-f387-1cad-8acd2d8df0c8';
const PMD_DATA    = 'fb005c82-02e7-f387-1cad-8acd2d8df0c8';
const HR_SERVICE = '0000180d-0000-1000-8000-00805f9b34fb';
const HR_CHAR = '00002a37-0000-1000-8000-00805f9b34fb';
const FS_NOMINAL = 52.0;

const EXERCISES = ['Pompes', 'Tractions', 'Squats', 'Tirage élastique', 'Brasse (air)', 'Crawl (air)', 'Dos crawlé (air)'];
let currentPosition = 'Avant-bras';
let currentExercise = null;
let isRecording = false;

let runningSampleCount = 0;
let recordStartSampleCount = 0;
let recordStartWallMs = 0;
let currentAcc = [];
let currentHr = [];
let latestHr = null;
const recordings = [];
let recTimerInterval = null;

let device, server, controlChar, dataChar, hrChar;

const logEl = document.getElementById('log');
const hrEl = document.getElementById('hr');
const recStatusEl = document.getElementById('recStatus');

function log(msg) {
  const t = new Date().toISOString().substr(11,8);
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---- Position toggle ----
document.getElementById('posAvantBras').onclick = () => setPosition('Avant-bras');
document.getElementById('posBiceps').onclick = () => setPosition('Biceps');
function setPosition(p) {
  currentPosition = p;
  document.getElementById('posAvantBras').className = p === 'Avant-bras' ? 'active-toggle' : '';
  document.getElementById('posBiceps').className = p === 'Biceps' ? 'active-toggle' : '';
}

// ---- Exercise grid ----
const gridEl = document.getElementById('exerciseGrid');
EXERCISES.forEach(ex => {
  const btn = document.createElement('button');
  btn.textContent = ex;
  btn.dataset.exercise = ex;
  btn.disabled = true;
  btn.onclick = () => toggleExercise(ex, btn);
  gridEl.appendChild(btn);
});

function toggleExercise(ex, btn) {
  if (isRecording && currentExercise === ex) {
    stopSession();
  } else if (!isRecording) {
    startSession(ex, btn);
  }
}

function setExerciseButtonsEnabled(enabled) {
  Array.from(gridEl.children).forEach(b => { if (b.dataset.exercise !== currentExercise) b.disabled = !enabled; });
}

function percentile(sortedArr, p) {
  const idx = (p/100) * (sortedArr.length - 1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if (lo === hi) return sortedArr[lo];
  return sortedArr[lo] + (sortedArr[hi] - sortedArr[lo]) * (idx - lo);
}

// ---- Offline "precise" re-analysis: the only counting method in this version.
// Accel-only, no integration, no drift. Zero-phase smoothing + whole-session threshold —
// both only possible after the fact. Validated at 11/14 within ±1 rep across the full
// exercise set, the best result of every approach tried in this project.
function gaussianSmooth(arr, sigmaSamples) {
  const radius = Math.ceil(sigmaSamples * 3);
  const kernel = [];
  let sum = 0;
  for (let i = -radius; i <= radius; i++) {
    const w = Math.exp(-(i*i)/(2*sigmaSamples*sigmaSamples));
    kernel.push(w);
    sum += w;
  }
  for (let i = 0; i < kernel.length; i++) kernel[i] /= sum;
  const out = new Array(arr.length).fill(0);
  for (let i = 0; i < arr.length; i++) {
    let acc = 0;
    for (let k = -radius; k <= radius; k++) {
      const idx = Math.min(arr.length - 1, Math.max(0, i + k));
      acc += arr[idx] * kernel[k + radius];
    }
    out[i] = acc;
  }
  return out;
}

function offlineReanalyze(accSamples) {
  const n = accSamples.length;
  if (n < 20) return null;
  const ux = [], uy = [], uz = [];
  for (const s of accSamples) {
    const norm = Math.sqrt(s.x*s.x + s.y*s.y + s.z*s.z) || 1e-6;
    ux.push(s.x/norm); uy.push(s.y/norm); uz.push(s.z/norm);
  }
  const mean = arr => arr.reduce((a,b)=>a+b,0)/arr.length;

  const searchN = Math.min(n, Math.round(FS_NOMINAL*3));
  const winN = Math.max(5, Math.round(FS_NOMINAL*0.6));
  let bestStart = 0, bestVar = Infinity;
  const varOf = arr => { const m = mean(arr); return arr.reduce((a,b)=>a+(b-m)*(b-m),0)/arr.length; };
  for (let start = 0; start <= Math.max(0, searchN - winN); start++) {
    const segVar = varOf(ux.slice(start, start+winN)) + varOf(uy.slice(start, start+winN)) + varOf(uz.slice(start, start+winN));
    if (segVar < bestVar) { bestVar = segVar; bestStart = start; }
  }
  let refX = mean(ux.slice(bestStart, bestStart+winN));
  let refY = mean(uy.slice(bestStart, bestStart+winN));
  let refZ = mean(uz.slice(bestStart, bestStart+winN));
  const refNorm = Math.sqrt(refX*refX + refY*refY + refZ*refZ) || 1e-6;
  refX/=refNorm; refY/=refNorm; refZ/=refNorm;

  const tiltRaw = [];
  for (let i = 0; i < n; i++) {
    const cosAngle = Math.max(-1, Math.min(1, ux[i]*refX + uy[i]*refY + uz[i]*refZ));
    tiltRaw.push(Math.acos(cosAngle) * 180 / Math.PI);
  }
  const tiltSmooth = gaussianSmooth(tiltRaw, 0.20 * FS_NOMINAL);

  const graceN = Math.round(FS_NOMINAL * 1.0);
  const posArr = tiltSmooth.slice(graceN);
  if (posArr.length < 10) return null;
  const sorted = [...posArr].sort((a,b) => a-b);
  const lo = percentile(sorted, 20), hi = percentile(sorted, 80);
  const mid = (lo+hi)/2, band = Math.max(hi-lo, 1e-6);
  const upperTh = mid + 0.15*band, lowerTh = mid - 0.15*band;
  let state = null, lastCountedState = null, reps = 0;
  for (const v of posArr) {
    const newState = v > upperTh ? 'top' : (v < lowerTh ? 'bottom' : state);
    if (newState !== state && newState !== null) {
      if (lastCountedState !== null && newState === lastCountedState) reps += 1;
      if (lastCountedState === null) lastCountedState = newState;
      state = newState;
    }
  }
  return reps;
}

function startSession(ex, btn) {
  currentExercise = ex;
  currentAcc = []; currentHr = [];
  recordStartSampleCount = runningSampleCount;
  recordStartWallMs = performance.now();
  isRecording = true;
  btn.classList.add('recording');
  btn.textContent = '⏹ ' + ex;
  setExerciseButtonsEnabled(false);
  document.getElementById('posAvantBras').disabled = true;
  document.getElementById('posBiceps').disabled = true;
  recStatusEl.classList.add('active');
  recStatusEl.textContent = `● ${ex} — ${currentPosition} (00:00)`;
  recTimerInterval = setInterval(() => {
    const s = Math.floor((performance.now() - recordStartWallMs) / 1000);
    const mm = String(Math.floor(s/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    recStatusEl.textContent = `● ${ex} — ${currentPosition} (${mm}:${ss})`;
  }, 500);
  log('Session démarrée: ' + ex + ' / ' + currentPosition);
}

function stopSession() {
  isRecording = false;
  clearInterval(recTimerInterval);
  recStatusEl.classList.remove('active');
  recStatusEl.textContent = 'Analyse en cours...';
  Array.from(gridEl.children).forEach(b => {
    b.disabled = false;
    b.classList.remove('recording');
    b.textContent = b.dataset.exercise;
  });
  document.getElementById('posAvantBras').disabled = false;
  document.getElementById('posBiceps').disabled = false;

  const offlineCount = offlineReanalyze(currentAcc);
  window._lastOfflineCount = offlineCount;
  document.getElementById('offlineGuess').textContent = offlineCount !== null ? offlineCount : '–';
  document.getElementById('repInput').value = offlineCount !== null ? offlineCount : '';
  document.getElementById('repPanel').style.display = 'block';
  recStatusEl.textContent = '';
}

document.getElementById('btnSubmitReps').onclick = () => {
  const reps = parseFloat(document.getElementById('repInput').value);
  if (isNaN(reps)) return;
  const offlineCount = window._lastOfflineCount ?? null;
  const recording = {
    exercise: currentExercise,
    position: currentPosition,
    startedAtIso: new Date().toISOString(),
    offlineRecount: offlineCount,
    groundTruthReps: reps,
    accSamples: currentAcc,
    hrSamples: currentHr
  };
  recordings.push(recording);
  const safeName = (currentExercise + '_' + currentPosition + '_' + Date.now()).toLowerCase().replace(/[^a-z0-9]+/g, '-');
  downloadJSON(recording, safeName + '.json');
  const cls = (offlineCount === reps) ? 'match' : 'off';
  const histEl = document.getElementById('history');
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = `${currentExercise} / ${currentPosition} — précis: ${offlineCount ?? '–'}, réel: ${reps}`;
  histEl.insertBefore(line, histEl.firstChild);
  document.getElementById('btnDownloadAll').disabled = false;
  document.getElementById('repPanel').style.display = 'none';
  currentExercise = null;
};

document.getElementById('btnCancelSession').onclick = () => {
  document.getElementById('repPanel').style.display = 'none';
  currentExercise = null;
  log('Session annulée (non sauvegardée)');
};

document.getElementById('btnDownloadAll').onclick = () => {
  downloadJSON(recordings, 'toutes_les_sessions_offline.json');
};

// ---- Connect ----
document.getElementById('btnConnect').onclick = async () => {
  document.getElementById('btnConnect').disabled = true;
  document.getElementById('btnConnect').textContent = 'Connexion en cours...';
  try {
    log('Recherche de périphériques "Polar"...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'Polar' }],
      optionalServices: [PMD_SERVICE, HR_SERVICE]
    });
    log(`Sélectionné: ${device.name}`);
    device.addEventListener('gattserverdisconnected', () => log('⚠️ Déconnecté'));
    server = await device.gatt.connect();
    log('GATT connecté.');

    const pmdService = await server.getPrimaryService(PMD_SERVICE);
    controlChar = await pmdService.getCharacteristic(PMD_CONTROL);
    dataChar = await pmdService.getCharacteristic(PMD_DATA);
    await controlChar.startNotifications();
    controlChar.addEventListener('characteristicvaluechanged', (e) => {
      const dv = e.target.value;
      log('CONTROL rx: ' + Array.from(new Uint8Array(dv.buffer)).map(b=>b.toString(16).padStart(2,'0')).join(' '));
    });
    await dataChar.startNotifications();
    dataChar.addEventListener('characteristicvaluechanged', (e) => handleAccData(e.target.value));
    log('PMD prêt.');

    const cmd = new Uint8Array([0x02, 0x02, 0x00, 0x01, 52, 0, 0x01, 0x01, 16, 0, 0x02, 0x01, 8, 0, 0x04, 0x01, 3]);
    await controlChar.writeValue(cmd);
    log('Flux ACC démarré.');

    try {
      const hrService = await server.getPrimaryService(HR_SERVICE);
      hrChar = await hrService.getCharacteristic(HR_CHAR);
      await hrChar.startNotifications();
      hrChar.addEventListener('characteristicvaluechanged', (e) => handleHrData(e.target.value));
      log('HR prêt.');
    } catch (e) { log('HR indisponible: ' + e); }

    document.getElementById('btnConnect').textContent = 'Connecté ✓';
    Array.from(gridEl.children).forEach(b => b.disabled = false);
  } catch (err) {
    log('ERREUR connexion: ' + err);
    document.getElementById('btnConnect').disabled = false;
    document.getElementById('btnConnect').textContent = 'Connecter (réessayer)';
  }
};

function handleHrData(value) {
  const flags = value.getUint8(0);
  const is16bit = flags & 0x1;
  const bpm = is16bit ? value.getUint16(1, true) : value.getUint8(1);
  latestHr = bpm;
  hrEl.textContent = 'HR: ' + bpm + ' bpm';
  if (isRecording) currentHr.push({ t: (runningSampleCount - recordStartSampleCount) / FS_NOMINAL * 1000, bpm });
}

// ---- Verified PMD delta-frame decompression ----
function bytesToBitArray(bytes) {
  const bits = [];
  for (const byte of bytes) { for (let i = 0; i < 8; i++) bits.push((byte >> i) & 1); }
  return bits;
}
function parseDeltaFrame(data, channels, bitWidth) {
  const bits = bytesToBitArray(data);
  const samples = [];
  let offset = 0;
  while (offset + bitWidth * channels <= bits.length) {
    const chSamples = [];
    for (let c = 0; c < channels; c++) {
      let value = 0;
      for (let i = 0; i < bitWidth; i++) value |= bits[offset + i] << i;
      offset += bitWidth;
      if (bitWidth > 1 && (value & (1 << (bitWidth - 1)))) value |= (-1 << bitWidth);
      chSamples.push(value);
    }
    samples.push(chSamples);
  }
  return samples;
}
function parseDeltaFramesAll(data, channels, resolution) {
  if (data.length === 0) return [];
  const resBytes = Math.ceil(resolution / 8);
  let offset = 0;
  const ref = [];
  for (let c = 0; c < channels; c++) {
    let v = 0;
    for (let b = 0; b < resBytes; b++) v |= data[offset + b] << (8 * b);
    const bits = resBytes * 8;
    if (v & (1 << (bits - 1))) v |= (-1 << bits);
    offset += resBytes;
    ref.push(v);
  }
  const samples = [ref];
  while (offset < data.length) {
    if (offset + 2 > data.length) break;
    const deltaSize = data[offset]; offset += 1;
    const sampleCount = data[offset]; offset += 1;
    const bitLength = sampleCount * deltaSize * channels;
    const length = Math.ceil(bitLength / 8);
    if (offset + length > data.length) break;
    const chunk = data.slice(offset, offset + length);
    const deltas = parseDeltaFrame(chunk, channels, deltaSize);
    for (const delta of deltas) {
      if (delta.length !== channels) continue;
      const last = samples[samples.length - 1];
      samples.push(last.map((v, i) => v + delta[i]));
    }
    offset += length;
  }
  return samples;
}

function handleAccData(value) {
  if (value.byteLength <= 10) return;
  const measType = value.getUint8(0);
  if (measType !== 0x02) return;

  const frameTypeByte = value.getUint8(9);
  const frameType = frameTypeByte & 0x7F;
  const isCompressed = (frameTypeByte & 0x80) > 0;
  if (!(isCompressed && frameType === 1)) return;
  const content = new Uint8Array(value.buffer, value.byteOffset + 10, value.byteLength - 10);

  let sampleList;
  try {
    sampleList = parseDeltaFramesAll(content, 3, 16);
  } catch (e) {
    log('Erreur décodage: ' + e);
    return;
  }
  if (sampleList.length === 0) return;

  for (const [x, y, z] of sampleList) {
    const mag = Math.sqrt(x*x + y*y + z*z);
    if (isRecording) {
      const t = (runningSampleCount - recordStartSampleCount) / FS_NOMINAL * 1000;
      currentAcc.push({ t, x, y, z, mag: Math.round(mag) });
    }
    runningSampleCount += 1;
  }
}
</script>
</body>
</html>
